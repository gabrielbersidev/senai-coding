<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogstagram</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: #fafafa;
            color: #262626;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-bottom: 50px;
        }

        .topo {
            position: sticky;
            top: 0;
            background: #ffffff;
            width: 100%;
            max-width: 470px;
            padding: 15px 20px;
            border-bottom: 1px solid #dbdbdb;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .topo h1 {
            font-size: 1.3rem;
        }

        select {
            padding: 6px 10px;
            font-size: 0.9rem;
            border: 1px solid #dbdbdb;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
        }

        /* Feed centralizado em coluna única */
        .feed {
            width: 100%;
            max-width: 470px;
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Cada "post" do Instagram */
        .post {
            background: #fff;
            border: 1px solid #dbdbdb;
            border-radius: 8px;
            overflow: hidden;
        }

        .post img {
            width: 100%;
            height: 470px;
            object-fit: cover;
            display: block;
        }

        .post-footer {
            padding: 12px 16px;
            font-size: 0.9rem;
            color: #555;
        }

        #mensagem {
            text-align: center;
            margin: 20px;
            color: #8e8e8e;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>
    <header class="topo">
        <h1>🐾 Dogstagram</h1>
        <div class="filtro">
            <select id="racas">
                <option value="">Todas as raças (Aleatório)</option>
            </select>
        </div>
    </header>

    <main class="feed" id="galeria">
    </main>

    <p id="mensagem"></p>

    <script>
        const racas = document.getElementById("racas");
        const galeria = document.getElementById("galeria");
        const mensagem = document.getElementById("mensagem");

        let carregando = false;

        async function carregarRacas() {
            try {
                const resposta = await fetch("https://dog.ceo/api/breeds/list/all");
                if (!resposta.ok) throw new Error("Erro na API");

                const dados = await resposta.json();
                for (let raca in dados.message) {
                    const opcao = document.createElement("option");
                    opcao.value = raca;
                    opcao.textContent = raca.charAt(0).toUpperCase() + raca.slice(1);
                    racas.appendChild(opcao);
                }
            } catch (erro) {
                mensagem.textContent = "Erro ao carregar raças.";
            }
        }

        function criarPost(urlImagem) {
            const postDiv = document.createElement("div");
            postDiv.classList.add("post");

            const img = document.createElement("img");
            img.src = urlImagem;
            img.alt = "Cachorro aleatório";
            img.loading = "lazy";

            const footer = document.createElement("div");
            footer.classList.add("post-footer");
            footer.innerHTML = "❤️ Curtido por doguinhos e outros usuários";

            postDiv.appendChild(img);
            postDiv.appendChild(footer);
            galeria.appendChild(postDiv);
        }

        async function carregarMaisPosts() {
            if (carregando) return;
            carregando = true;
            mensagem.textContent = "Carregando mais doguinhos...";

            const racaSelecionada = racas.value;
            let url = "";

            if (racaSelecionada === "") {
                url = "https://dog.ceo/api/breeds/image/random/4"; // Puxa de 4 em 4
            } else {
                url = `https://dog.ceo/api/breed/${racaSelecionada}/images/random/4`;
            }

            try {
                const resposta = await fetch(url);
                if (!resposta.ok) throw new Error("Erro na API");

                const dados = await resposta.json();

                const imagens = Array.isArray(dados.message) ? dados.message : [dados.message];

                imagens.forEach(urlImg => criarPost(urlImg));
                mensagem.textContent = "";
            } catch (erro) {
                mensagem.textContent = "Erro ao carregar novas imagens.";
            } finally {
                carregando = false;
            }
        }

        window.addEventListener("scroll", () => {
            const pertoDoFim = window.innerHeight + window.scrollY >= document.documentElement.scrollHeight - 300;

            if (pertoDoFim && !carregando) {
                carregarMaisPosts();
            }
        });

        racas.addEventListener("change", () => {
            galeria.innerHTML = "";
            carregarMaisPosts();
        });

        carregarRacas();
        carregarMaisPosts();
    </script>
</body>
</html>
