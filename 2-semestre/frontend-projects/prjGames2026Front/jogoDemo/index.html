
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Jogos</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Jogos</h1>

        <form id="formJogo">

            <label>Nome do jogo:</label>
            <input type="text" id="name" required>

            <label>Plataforma:</label>
            <input type="text" id="platform" required>

            <label>Preço:</label>
            <input type="number" id="price" step="0.01" required>

            <label>Categoria:</label>
            <input type="text" id="category" required>

            <label>Imagem do jogo:</label>
            <input type="file" id="thumbnail" accept="image/*" hidden>

            <button type="button" onclick="document.getElementById('thumbnail').click()">
                Selecionar Imagem
            </button>

            <button type="submit">Salvar Jogo</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
