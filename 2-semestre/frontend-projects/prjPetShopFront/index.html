<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastre seus Pets!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Cadastro de Pets - PETSHOP</h1>

        <form id="formPet">

            <label for="nome">Nome do Pet:</label>
            <input type="text" id="nome" required>

            <label for="tutorNome">Nome do Tutor:</label>
            <input type="text" id="tutorNome" required>

            <label for="tipo">Tipo:</label>
            <input type="text" id="tipo" required>

            <label for="raca">Raça:</label>
            <input type="text" id="raca" required>

            <label for="sexo">Sexo:</label>
            <input type="text" id="sexo" required>

            <label for="idade">Idade:</label>
            <input type="number" id="idade" min="0" required>

            <label for="foto">Imagem do Pet:</label>
            <input type="file" id="foto" accept="image/*" hidden>

            <button type="button" onclick="document.getElementById('foto').click()">
                Selecionar Imagem
            </button>

            <button type="submit">Salvar Pet</button>

        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
